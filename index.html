<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hayden's Homework</title>
    <!-- Family Board typeface: the mockup's own rounded, kid-friendly
         display font. `font-display` (a Tailwind class used throughout
         this app) has never actually resolved to a real font-family — no
         tailwind.config defines it — so every heading using it has always
         silently fallen back to the browser's default serif, in
         production too, not just this sandbox. Rather than rely on that
         broken class for the one surface (Family Board) where the font
         is now an explicit pixel-match requirement, load the real
         typeface directly and apply it via a plain CSS rule below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Family Board no-scroll fix: html/body/#root need a real, unbroken
         100%-height chain for any child's `height: 100vh` + `overflow:
         hidden` to actually bound content (see FamilyBoard.jsx). Also
         zeroes the browser's default 8px body margin. Tailwind's own
         Preflight reset would normally cover this, but it's CDN-loaded
         (see the script tag above) and this exact environment's own
         network policy blocks that CDN outright — inline here so the
         reset is guaranteed regardless of the CDN's availability. -->
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      /* K-5 REDESIGN full-viewport shell: a plain CSS rule (not a Tailwind
         utility) so it survives even when the Tailwind CDN above fails to
         load. The duplicate `height` declaration is a deliberate CSS
         fallback, not a bug — a browser that doesn't understand `100dvh`
         simply ignores that line and keeps the `100vh` rule above it;
         one that does understand it uses `100dvh` instead (Section 2/4:
         "height: 100dvh where supported"). FamilyBoard.jsx applies this
         class to its outermost shell. */
      .familyboard-viewport {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        /* Cascades to every piece of text inside Family Board (titles, day
           headers, card titles, chips, pills) without needing to touch
           each one's own inline style — font-family inherits by default.
           Scoped to this one class, so Parent Board/Settings (which never
           carry this class) are completely unaffected. */
        font-family: "Baloo 2", ui-rounded, "Segoe UI", Verdana, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
